[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitreetop"
version = "0.1.0"
description = "btop/jtop-style terminal console for Unitree robots (Go2/B2/H1/G1/H1-2): host + robot monitoring (joints, battery, IMU) and keyboard teleop over unitree_sdk2"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "SimonKenneth" }]
keywords = ["unitree", "robot", "jetson", "monitor", "top", "dds", "go2", "g1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Robotics",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.6"]

[project.urls]
Repository = "https://github.com/SimonKennethRobo/unitreetop"

[project.optional-dependencies]
# unitree_sdk2py is not on PyPI: install it from https://github.com/unitreerobotics/unitree_sdk2_python
jetson = ["jetson-stats>=4.2"]
nvidia = ["nvidia-ml-py"]

[project.scripts]
unitreetop = "unitreetop.__main__:main"
untop = "unitreetop.__main__:main"

[tool.setuptools.packages.find]
include = ["unitreetop*"]
